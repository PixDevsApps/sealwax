[package]
name = "email-spike-s4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
quick-xml = "0.42.0"
psl = "2.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.0"
