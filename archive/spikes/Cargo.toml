# The M0 spikes (S1–S7), kept as history in their own workspace so their dependencies and
# features stay out of Sealwax's build (ADR-025). Build from the repository root with
# `cargo build --manifest-path archive/spikes/Cargo.toml -p email-spike-<id>`.
[workspace]
members = ["s1-imap", "s2-webkit", "s3-store", "s4-autodetect", "s4b-autodetect", "s5-oauth", "s6-desktop", "s7-composer"]
resolver = "3"

[workspace.package]
version = "1.1.7"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
sealwax-domain = { path = "../../domain" }
sealwax-infrastructure = { path = "../../infrastructure" }
sealwax-engine = { path = "../../engine" }
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
async-channel = "2.5"
anyhow = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tempfile = "3.27"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }

# The same vendored crates as Sealwax's workspace (vendor/README.md).
[patch.crates-io]
lettre = { path = "../../vendor/lettre" }
imap-proto = { path = "../../vendor/imap-proto" }
async-imap = { path = "../../vendor/async-imap" }
