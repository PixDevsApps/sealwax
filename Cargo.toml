[workspace]
members = ["app", "domain", "infrastructure", "engine", "spikes/*"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
sealwax-domain = { path = "domain" }
sealwax-infrastructure = { path = "infrastructure" }
sealwax-engine = { path = "engine" }
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
async-channel = "2.5"
anyhow = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27"
rusqlite = "0.40.2"
mail-parser = { version = "~0.11.9", features = ["full_encoding"] }
html2text = "~0.17.1"
webkit6 = { version = "0.6.1", features = ["v2_52"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
sha2 = "0.10.9"
libc = "0.2.190"

[profile.release]
lto = "thin"
codegen-units = 1
