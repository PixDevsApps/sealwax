[workspace]
members = ["app", "domain", "infrastructure", "engine", "spikes/*", "devtools/*"]
exclude = ["fuzz", "vendor/lettre"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
sealwax-domain = { path = "domain" }
sealwax-infrastructure = { path = "infrastructure" }
sealwax-engine = { path = "engine" }
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
async-channel = "2.5"
anyhow = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27"
rusqlite = "0.40.2"
mail-parser = { version = "~0.11.9", features = ["full_encoding"] }
html2text = "~0.17.1"
webkit6 = { version = "0.6.1", features = ["v2_52"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
toml_edit = "0.25.15"
getrandom = "0.4.3"
sha2 = "0.10.9"
libc = "0.2.190"
insta = "1.48"
proptest = "1.11"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
encoding_rs = "0.8.35"
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3.34"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
rustls-pki-types = { version = "1.15", features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
quick-xml = "0.42.0"
psl = "2.1"
idna = "1.1"

# lettre 0.11.23 with a longer reply-line limit (vendor/README.md).
[patch.crates-io]
lettre = { path = "vendor/lettre" }

[profile.release]
lto = "thin"
codegen-units = 1
