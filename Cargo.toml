[workspace]
members = ["app", "domain", "infrastructure", "engine", "uitest", "devtools/*"]
exclude = ["fuzz", "archive/spikes", "vendor/lettre", "vendor/imap-proto", "vendor/async-imap"]
default-members = ["app", "domain", "infrastructure", "engine"]
resolver = "3"

[workspace.package]
version = "1.1.8"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
sealwax-domain = { path = "domain" }
sealwax-infrastructure = { path = "infrastructure" }
sealwax-engine = { path = "engine" }
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
async-channel = "2.5"
anyhow = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27"
rusqlite = "0.40.2"
mail-parser = { version = "~0.11.9", features = ["full_encoding"] }
html2text = "~0.17.1"
webkit6 = { version = "0.6.1", features = ["v2_52"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
toml_edit = "0.25.15"
getrandom = "0.4.3"
sha2 = "0.10.9"
libc = "0.2.190"
insta = "1.48"
proptest = "1.11"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
encoding_rs = "0.8.35"
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3.34"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
rustls-pki-types = { version = "1.15", features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
quick-xml = "0.42.0"
psl = "2.1"
idna = "1.1"
ammonia = "~4.1.5"
html5ever = "0.39"
mail-builder = { version = "~1.0.0", default-features = false }
oo7 = "0.6"
zeroize = "1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
socket2 = "0.6.5"
base64 = "0.22.1"
url = "2.5.8"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

# The lint policy (ADR-025): each crate opts in with `[lints] workspace = true`; `tools/ci.sh` runs
# Clippy with `-D warnings`, so a warning here fails CI. `clippy::unwrap_used` is set in each
# product crate's root instead, so it covers the shipped code and not test helpers.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "warn"

# lettre 0.11.23 with a longer reply-line limit, imap-proto 0.17.0 with a nesting limit and
# reading Proton Mail Bridge's replies, and async-imap 0.12.0 with a buffer that grows with a
# literal's data (vendor/README.md).
[patch.crates-io]
lettre = { path = "vendor/lettre" }
imap-proto = { path = "vendor/imap-proto" }
async-imap = { path = "vendor/async-imap" }

[profile.release]
lto = "thin"
codegen-units = 1
