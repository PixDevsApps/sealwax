<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { color-scheme: light; }
html { background: #ffffff; color: #1e1e1e; }
body {
  margin: 0;
  padding: 14px 18px 40px;
  min-height: 100vh;
  box-sizing: border-box;
  font: 15px/1.55 sans-serif;
  overflow-wrap: anywhere;
  caret-color: #c06000;
  outline: none;
}
a { color: #1a5fb4; }
blockquote:not([style]) {
  margin: 0 0 0 0.8ex;
  padding-left: 1ex;
  border-left: 2px solid #8a8a8a;
  color: #555555;
}
img { max-width: 100%; height: auto; }
ul, ol { margin: 0.3em 0; padding-left: 1.8em; }
pre { white-space: pre-wrap; }
</style>
</head>
<body><div><br></div></body>
</html>
