# The real-world corpus (M5, ML-059): open-licensed HTML email templates from public
# repositories, fetched by tools/corpus/fetch.py into .local/corpus/real/ (git-ignored) and
# rendered through the reader by app/examples/reader_corpus.rs. Only this manifest is
# committed; the templates are third-party content under the licences below.
#
# Every url and licence_url is a raw.githubusercontent.com URL pinned to a full commit SHA, so
# the bytes never change; sha256 and bytes were computed from the downloaded bytes on
# 2026-10-06 and are checked on every fetch. The fetch sends anonymous GETs with the
# User-Agent "mail-dev (automated)" and nothing else.
#
# kind: what the template is for. features, found by grepping the bytes (case-insensitive):
#   dark-mode      prefers-color-scheme, a color-scheme meta (even light only) or
#                  supported-color-schemes
#   mso            "<!--[if mso", "[if gte mso" or "mso-"
#   vml            v:rect, v:roundrect, v:fill, v:image or xmlns:v=
#   responsive     @media
#   remote-images  an http(s) <img>, CSS url() (not @import), background attribute or VML src
#   table-layout   layout tables
#
# Repositories checked (verdict, licence source, pinned commit):
#   ActiveCampaign/postmark-templates        allowed  MIT (LICENSE)
#       fa73527acb4eb59cf673a54572d213e908f1515c  13 taken from templates-inlined/ (full documents)
#   mailgun/transactional-email-templates     allowed  MIT (LICENSE)
#       e05e59e8c1e0fa7ffbacc7a165a609fd37c590b5  6 taken (current embedded-CSS versions + older inlined/)
#   leemunroe/responsive-html-email-template  allowed  MIT (license.txt)
#       60b5b6ddf9600e4b7d7e1ef60e5a3a8f1e56e186  2 taken
#   TedGoas/Cerberus -> redirects to emailmonday/Cerberus   allowed  MIT (LICENSE)
#       af3cec9dd12fbbea0c6e9a1b0bf82a0479726957  6 taken (3 current patterns + 3 archived versions)
#   mjmlio/email-templates                    rejected: no licence file and no licence statement in
#       README; the repo holds only .mjml sources, no compiled HTML
#       a7230b13086c1746524839768fe0bc15a897d960  0 taken
#   sendgrid/email-templates                  allowed  MIT (LICENSE)
#       12f459a7848761c7dba024a5431c0ce468aca82d  9 taken
#   sendwithus/templates                      allowed  Apache-2.0 (LICENSE; README says all templates are Apache 2.0)
#       f555e49038ed9ac05a39bf7048a73616f69680ac  15 taken (templates/cerberus/* skipped as copies of Cerberus)
#   zurb/foundation-emails -> foundation/foundation-emails   licence allowed (MIT, LICENSE.md) but 0 taken:
#       templates/*.html are Inky sources without <html>/<body> that need the build step
#       7a37ae4cad4f97068f8257ba92a67a261080e3c5
#   zurb/foundation-emails-template -> foundation/foundation-emails-template   licence allowed (MIT, LICENSE)
#       but 0 taken: src/pages are Inky sources plus layouts, no compiled output committed
#       3b40a8e387fc97785910edffd9cc4feb6d68ac0b
#   seanpowell/Email-Boilerplate              allowed  MIT (stated with full text in README.markdown; no LICENSE file)
#       6944456a63323f83f4badde1068706817f4c145f  3 taken
#   InterNations/antwort-email-boilerplate    404; the project lives at InterNations/antwort
#   InterNations/antwort                      allowed  MIT (LICENSE.md; README says MIT)
#       ff8b8d697d687c8e3d0a4e49fcc718dc7568861b  3 taken (compiled build.html files only, not source/)
#   konsav/email-templates                    allowed  MIT (LICENSE)
#       f0a29dae21533af2c4737ffcb01863fc8c038046  3 taken
#   ColorlibHQ/email-templates                allowed  MIT (LICENSE-MIT; README says MIT)
#       3018557fe943fb1c3e3367aa52d39b2fca44f725  9 taken (MJML-compiled N/index.html; images use relative
#       paths such as images/product-1.jpg that are not part of the corpus, so they render as broken)
#   mailchimp/email-blueprints                rejected: README licenses the blueprints under CC BY-SA 3.0
#       4d4daa85a8107baf128b88dd3baaf16137befb8e  0 taken
#   maizzle/maizzle                           0 taken: no .html files and no root LICENSE at this commit
#       (framework starter, sources need a build)
#       9fd85ab68d848c251da2faa39d4c48d9cf5ea056
#   Not checked (target already reached): unlayer, Mailjet, emailmonks, dyspatch, rodriguezcommaj, hteumeuleu.
#
#
# Some templates hold {{ }} placeholders and sample names; Colorlib's use relative image
# paths that aren't part of the corpus, so those images show as missing.

