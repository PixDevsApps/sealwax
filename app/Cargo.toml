[package]
name = "sealwax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "sealwax_app"
path = "src/lib.rs"

[[bin]]
name = "sealwax"
path = "src/main.rs"

[features]
# The self-test runner, the sample mail, the stand-in composer backend and the public modules the
# harnesses drive: for `sealwax-selftest` (uitest/) only, never in the released binary (ADR-025).
test-hooks = ["sealwax-infrastructure/test-support"]

[dependencies]
sealwax-domain.workspace = true
sealwax-infrastructure.workspace = true
sealwax-engine.workspace = true
gtk4.workspace = true
libadwaita.workspace = true
gio.workspace = true
glib-unix.workspace = true
async-channel.workspace = true
getrandom.workspace = true
clap.workspace = true
tracing.workspace = true
webkit6.workspace = true
