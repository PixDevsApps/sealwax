# Coverage-guided fuzz targets (ML-093): libFuzzer through libfuzzer-sys on the stable
# toolchain, run by tools/fuzz.sh. A workspace of its own, so the normal build never compiles
# it; the entry points live in the crates (`sealwax_domain::fuzz`, `sealwax_engine::fuzz`).
[package]
name = "sealwax-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libfuzzer-sys = "0.4.13"
sealwax-domain = { path = "../domain", features = ["fuzz"] }
sealwax-engine = { path = "../engine", features = ["fuzz"] }

[workspace]

# The same patched lettre and imap-proto as the main workspace (vendor/README.md).
[patch.crates-io]
lettre = { path = "../vendor/lettre" }
imap-proto = { path = "../vendor/imap-proto" }

[profile.release]
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# mail-parser 0.11.9's `debug_assert!(false, "Invalid part ID, could not find multipart.")`
# (src/parsers/message.rs:485) fires on fuzzed multiparts; release builds, Sealwax's among
# them, compile it out and parse on (docs/m9/security.md).
[profile.release.package.mail-parser]
debug-assertions = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

