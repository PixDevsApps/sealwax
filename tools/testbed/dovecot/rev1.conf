# Mail testbed: Dovecot 2.4 restricted to plain IMAP4rev1 capabilities, to exercise the client's
# fallbacks (no CONDSTORE, QRESYNC, MOVE, UIDPLUS, SPECIAL-USE, IDLE, ESEARCH or COMPRESS advertised).
# The override changes only what is advertised; a client must not send what it was not offered.
# Test data only; any user name logs in with the testbed password.
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap

default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

mail_driver = maildir
mail_path = ~/mail
mail_home = /srv/vmail/%{user | lower}
mail_uid = vmail
mail_gid = vmail

imap_capability = IMAP4rev1

auth_allow_cleartext = no
passdb static {
  password = testbed-password
}

ssl = required
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}

namespace inbox {
  inbox = yes
  separator = /
}

service imap-login {
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}
