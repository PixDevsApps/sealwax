# Mail testbed: Dovecot 2.4 with the full extension set (CONDSTORE, QRESYNC, MOVE, UIDPLUS,
# SPECIAL-USE, IDLE, COMPRESS, ID). Test data only; any user name logs in with the testbed password.
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap

default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_path = ~/mail
mail_home = /srv/vmail/%{user | lower}
mail_uid = vmail
mail_gid = vmail
mail_utf8_extensions = yes
imap4rev2_enable = yes

auth_allow_cleartext = no
passdb static {
  password = testbed-password
}

ssl = required
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Utkast {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sendt {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Søppelpost {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Papirkurv {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Arkiv {
    special_use = \Archive
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}
