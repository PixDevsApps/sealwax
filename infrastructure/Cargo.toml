[package]
name = "sealwax-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The store's schema steps and internals its suites (tests/store/) check, and the loopback socket
# lookup the app's self-tests use: for tests only (ADR-025 amendment).
test-support = []

[dependencies]
sealwax-domain.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
sha2.workspace = true
thiserror.workspace = true
getrandom.workspace = true
libc.workspace = true

[dev-dependencies]
# Itself with test-support, so `cargo test` builds tests/store/ without a flag.
sealwax-infrastructure = { path = ".", features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
